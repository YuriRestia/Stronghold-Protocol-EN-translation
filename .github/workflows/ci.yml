name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Weights: author-reported run 39617468541 (not independently remeasured here), fullmatch-coop median 235132 ms,
    # Windows shard 0 wall clock 397 s. docs/CI.md records provenance; 20 min leaves runner variance/hang margin.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # (fork) 24 = the LTS line the whole suite runs on, one job per shard (user 2026-11-24: its JUnit names each test's
        # file, which re-weighing ci-shards.json needs). Node 22 has its own light lane while the live servers run it (job `node22`).
        node: [24]
        # the shards of ci-shards.json: together they are exactly the full `npm test`, apart they are four shorter jobs
        shard: [0, 1, 2, 3]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
      # tools/test-run.mjs runs this shard's files: `npm run test` stays the whole suite everywhere else
      SHARD: ${{ matrix.shard }}
      # (fork) and writes the shard's JUnit report beside the normal output: the per-file times ci-shards.json is
      # re-weighed from (docs/CI.md「权重来源与更新」), kept by the upload step below
      JUNIT: junit.xml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      # package.json "test": node tools/test-run.mjs over the test files of this job's SHARD (the whole suite when
      # SHARD is unset). A bare `node --test` would also run every helper and fixture under test/.
      - name: Unit & integration tests
        run: npm run test

      # (fork) the JUnit report of this shard, a failed run's too, kept 3 days: tools/test-timings.mjs reads it
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-shard${{ matrix.shard }}
          path: junit.xml
          retention-days: 3
          if-no-files-found: warn

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  # (fork) TEMPORARY: the node 22 lane, while the live servers still run node 22; remove it once they run 24. The other
  # LTS line gets a cheap check, not a second full suite: the CI guards (node's own test runner and glob) and the plugin
  # sandbox tests, whose child process and --permission flags are what differs between node versions on a server.
  node22:
    name: node 22 (live servers, temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: CI guard tests (sharding and workflow wiring)
        run: npm run test:guards

      - name: Plugin sandbox tests (the live servers' node)
        run: node --test test/plugins/sandbox-host.test.js test/match/plugin-host.test.js test/plugin-package.test.js

  # Separate from the test matrix so lint / types / import boundaries run once, outside the eight test jobs.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Lint (warnings allowed)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

  # Compare the full corpus once, independently of the OS × Node test matrix; never update expected results here.
  golden:
    name: golden (full corpus, ubuntu, node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Full Golden regression check
        run: npm run golden
