<!doctype html>
<!--
  (fork) Animated illustration review (crew-docs l2d-art-proposal §8, D12): every official dynamic illustration this
  server has, on the real screens — the result screen's team cards, the room's seat cards and the Grand Alliance room's
  eight — group by group, on a PC window or a landscape phone frame, behaving exactly as in the game.
  URL: ?screen=result|room|ga  &page=<n, from 1>  &device=pc|phone  &slow=<MB/s> (a throttled connection: the late
  switch)  &lang=en|ja|…  &shot=1 (no bar). Review-only buttons (not in the game): previous / next group, replay the
  card entrance, play the special idle or Start now. Keyboard: ← / → groups, ` toggles the bar.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Animated illustrations · review</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/screens/lobby.css" />
  <link rel="stylesheet" href="/css/screens/room.css" />
  <link rel="stylesheet" href="/css/screens/game.css" />
  <link rel="stylesheet" href="/css/screens/game-panels.css" />
  <link rel="stylesheet" href="/css/screens/result.css" />
  <link rel="stylesheet" href="/css/screens/settle.css" />
  <link rel="stylesheet" href="/css/emotes.css" />
  <link rel="stylesheet" href="/css/devices.css" />
  <script type="importmap">
    { "imports": { "preact": "/vendor/preact.module.js", "preact/hooks": "/vendor/hooks.module.js", "htm": "/vendor/htm.module.js" } }
  </script>
  <style>
    .rvbar { position: fixed; z-index: 200; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; max-width: calc(100vw - 16px);
      padding: 6px 8px; background: rgba(6, 9, 8, .92); border: 1px solid #3e4b45; font: 12px/1.3 sans-serif; color: #c3cbc7; }
    .rvbar b { color: #4ed8af; letter-spacing: .08em; margin-right: 4px; }
    .rvbar button { padding: 4px 8px; background: #141816; border: 1px solid #2f3a35; color: #f2f2f2; font-size: 12px; cursor: pointer; }
    .rvbar button:hover { border-color: #4ed8af; }
    .rvbar button.on { background: #145443; border-color: #4ed8af; }
    .rvbar .sep { width: 1px; height: 18px; background: #2f3a35; margin: 0 4px; }
    .rvbar .names { flex-basis: 100%; color: #8fa39b; font-size: 11px; }
    .rvbar.hidden { display: none; }
    .rvphone { position: fixed; inset: 0; display: grid; place-items: center; background: #050706; }
    .rvphone iframe { width: 812px; height: 375px; border: 1px solid #3e4b45; transform-origin: center; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="rvbar" class="rvbar"></div>
  <script type="module" src="/dev/dyn-review.js"></script>
</body>
</html>
