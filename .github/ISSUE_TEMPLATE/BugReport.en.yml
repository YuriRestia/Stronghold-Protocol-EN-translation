name: Bug report (English)
description: You ran into a bug while using it.
title: "[Bug]:"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please give it a title in the box above ⬆️ that clearly describes the problem, so the developers can work on it.

        > [!important]
        > Important: if you are reporting **several bugs**, please open a separate issue for each one.
        >
        > If you are not sure how to describe it clearly and precisely, we suggest reading *How To Ask Questions The Smart Way* first ([link](http://www.catb.org/~esr/faqs/smart-questions.html)).
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: "Before reporting this problem, please check:"
      options:
        - label: I have tested on the latest version ![latest version](https://img.shields.io/github/v/release/sganggs/Stronghold-Protocol?include_prereleases&style=flat-square&label=) or ![latest version](https://img.shields.io/github/v/release/sganggs/Stronghold-Protocol?style=flat-square&label=) and looked at the [latest commits](https://github.com/sganggs/Stronghold-Protocol/commits/master/), and this bug is not fixed yet. I have also searched the [Issues](https://github.com/sganggs/Stronghold-Protocol/issues), and this bug has not been reported before.
          required: true
        - label: I understand and agree that this is only for reporting problems in the program (questions about anything else belong in Discussions).
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        The version you are using. See the version number in the corner of the title screen, or the file name of the release zip. When running from a source checkout, run `git rev-parse --short HEAD` in the repository folder. The number in the badges above is the repository's latest release, only for comparison; it is not your version.
      placeholder: "e.g. 0.3.0, or a short commit hash"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### About the bug

        Describe the bug you ran into. You can attach screenshots, screen recordings, stack traces, logs and so on, to help the developers track it down.

        > [!note]
        > For attachments, **please use GitHub's own attachment upload first**: paste or drag the files into the text box to upload them. Several files can be packed into one zip.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe in detail what you expected to happen, pointing out how it differs from the current (possibly wrong) behavior.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What actually happened
      description: What actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: |
        Describe in detail what to do to make this bug happen again.
      placeholder: |
        1. First…
        2. Then…
        3. …
    validations:
      required: true
  - type: dropdown
    id: plugins
    attributes:
      label: Were plugins on?
      description: |
        Plugins are unofficial. If the room where the problem happened had plugins on, please first check whether it still happens with the plugins off (vanilla). A problem that only happens in a plugin room should go to the plugin's author first.
        The second line (content: …) of the in-game "Report a problem" report shows the room's content: `vanilla` is the original game, `MODDED` means a plugin that changes the gameplay is on.
      options:
        - No (vanilla)
        - Only cosmetic plugins
        - A plugin that changes the gameplay (unofficial match)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: vanilla-repro
    attributes:
      label: Problems in a plugin room
      description: For a problem that happened with plugins on, please tick the box below (skip it if no plugins were on).
      options:
        - label: I have reproduced this problem in vanilla (with every plugin off)
  - type: input
    id: content-line
    attributes:
      label: Content line (optional)
      description: "What comes after content: on the second line of the \"Report a problem\" report (vanilla, or the plugins and content hash). It helps the developers confirm which content the match used."
      placeholder: "vanilla cs=… or MODDED cs=… plugins=…"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recording (optional, recommended)
      description: |
        If you can, please add screenshots or a screen recording that help describe the problem.
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace (optional)
      description: If the game crashed when you hit this bug (a crash message popped up), or it wrote an error log, please paste the stack trace here to help the developers find the bug.
      render: shell
  - type: checkboxes
    id: revision
    attributes:
      label: Last step
      description: Look over your answers
      options:
        - label: I believe the description above is detailed enough for the developers to reproduce the problem. If my issue does not follow the requirements above, it may be closed without further notice.
          required: true
